packages:
  - apps/*
  - packages/*

catalog:
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource/inter": ^5.3.0
  "@tailwindcss/cli": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@cloudflare/workers-types": ^5.20261007.1
  "@types/node": ^24.0.0
  hono: ^4.13.13
  jsdom: ^30.0.1
  portless: ^0.15.9
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vitest: ^4.1.11
  wrangler: ^4.152.0

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: true
  workerd: true
shellEmulator: true
engineStrict: true
verifyDepsBeforeRun: error
overrides:
