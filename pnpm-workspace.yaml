  fflate@0.7: ">=0.7.5 <0.8"
  http-cache-semantics@4: ">=4.2.1 <5"
  source-map-js@1: ">=1.2.2 <2"
  sharp@0: ">=0.35.5 <0.36"
  smol-toml@1: ">=1.9.0 <2"
  zod@4: ">=4.6.6 <5"
minimumReleaseAgeExclude:
  - "@vitest/mocker@4.1.12"
  - fast-uri@3.1.9
  - zod@4.6.6
  - undici@8.12.2
