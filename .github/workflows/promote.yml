name: Promote

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SHA: ${{ github.sha }}
    steps:
      - name: Require a run on main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run Promote on main, not $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fast-forward live
        run: |
          git push origin "$SHA:refs/heads/live"
          echo "live is now at $SHA. Workers Builds checks it and deploys it." \
            >> "$GITHUB_STEP_SUMMARY"
