name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Reject pre-launch vocabulary in shipped files
        run: |
          if git grep -In -i -e 'phase2' -e 'phase 2' -e 'phase-2' -- . ':(exclude).github/workflows/ci.yml' ; then
            echo "::error::Do not use 'phase 2' in tracked files."
            exit 1
          fi
      - run: pnpm format:check
      - run: pnpm check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the same build command Cloudflare Workers Builds runs
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WRANGLER_LOG_PATH: ${{ github.workspace }}/.wrangler/logs
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create the local D1 schema the signup path writes to
        run: pnpm wrangler d1 migrations apply rupeefund-waitlist --local
      # workaround: cloudflare/workers-sdk#15317
      - name: Run the browser suite, and retry once if the dev server dies
        run: |
          pnpm test:e2e || {
            echo "::warning::e2e retried once, see cloudflare/workers-sdk#15317"
            pnpm test:e2e
          }
      - name: Keep the Playwright report when a run fails
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            .wrangler/logs
          retention-days: 7
