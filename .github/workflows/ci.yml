name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Reject pre-launch vocabulary in shipped files
        run: |
          if git grep -In -i -e 'phase2' -e 'phase 2' -e 'phase-2' -- . ':(exclude).github/workflows/ci.yml' ; then
            echo "::error::Do not use 'phase 2' in tracked files."
            exit 1
          fi
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm audit --prod --audit-level=moderate

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the Workers Builds build command on the sample content
        run: pnpm run build
        env:
          CMS_CONTENT_FILE: tests/fixtures/content/published.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WRANGLER_LOG_PATH: ${{ github.workspace }}/.wrangler/logs
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rupeefund/web exec playwright install --with-deps chromium
      - name: Create the local D1 schema the signup path writes to
        run: pnpm db:reset
      # workaround: cloudflare/workers-sdk#15317
      - name: Run the browser suite, and retry once if the dev server dies
        run: |
          pnpm test:e2e || {
            echo "::warning::e2e retried once, see cloudflare/workers-sdk#15317"
            pnpm test:e2e
          }
      - name: Keep the Playwright report when a run fails
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            .wrangler/logs
          retention-days: 7
