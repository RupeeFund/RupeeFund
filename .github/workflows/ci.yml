name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: typecheck
            run: pnpm typecheck
          - check: test
            run: pnpm test
          - check: build
            run: pnpm run build
          - check: audit
            run: pnpm audit --prod --audit-level=moderate
          - check: dev-start
            run: pnpm db:reset && node scripts/dev-smoke.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ${{ matrix.run }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WRANGLER_LOG_PATH: ${{ github.workspace }}/.wrangler/logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter @rupeefund/web exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"
      - id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm --filter @rupeefund/web exec playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm --filter @rupeefund/web exec playwright install-deps chromium
      - run: pnpm test:e2e
      - name: Keep the Playwright traces when a run fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            apps/web/test-results
            .wrangler/logs
          retention-days: 7
